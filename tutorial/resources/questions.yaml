# The questions of the notebooks and their solutions.
# In a notebook, ask_question("1.1") shows question 1.1 and its choices; the right choice unfolds its solution.

# 1. Dynamic Autoscaling

"1.1":
  question: |
    With 10% as the community-accepted error rate, is OpenDT accurate enough for what-if analysis on SURF? In which hours is OpenDT the least accurate and why?
  solution: |
    OpenDT has ~6% MAPE, thus, within the community-accepted limits. However, OpenDT tends to drift in the first few hours, 
    until calibration "kicks in", and drops MAPE to under 5%.
  choices:
    - "Yes, OpenDT's MAPE is about 1%, the same in every hour"
    - "Yes, OpenDT's MAPE is about 6%, worst in the first 6 hours"
    - "No, OpenDT's MAPE is about 15%, worst in the evening"
    - "No, OpenDT's MAPE is over 10% in every hour"
  answer: B

"1.2":
  question: |
    Estimate: SURF draws about 22 kW with 277 hosts; how much would SURF draw with 2,770 hosts (10x more hosts)?
  choices:
    - About 22 kW, the same
    - About 84 kW, ~4x
    - About 220 kW, ~10x
    - About 350 kW, ~16x
  answer: B
  solution: |
    About 84 kW, 4x; next question (1.3) asks why.

"1.3":
  question: |
    Interesting, 10x infrastructure, but only 4x more power! Why is that?
  solution: |
    The jobs are identical, so the ~2,500 hosts sit idle. However, they still draw electricity! At 25W per host, we 
    it leads to 62kW (2,493 x 25 W = 62 kW), just for staying idle.
    Over-provisioning could lead to sustainability concerns, both environmental and financial, where energy (and thus,
    money) is wasted by idle infrastructure.
  choices:
    - "About 10x: each extra host runs jobs too"
    - "About the same: idle hosts draw nothing"
    - "About 4x: the extra hosts are idle, but draw power"
    - "About 2x: the jobs spread over more hosts and end sooner"
  answer: C
  explore: "Add 500 and 1,000 to `sizes` and run the cell again: how many watts does each extra host add, and why this number?"

"1.4":
  question: |
    Let's downscale to 138 and 69 hosts. How much power do we save? How does downscaling affect the jobs?
  solution: |
    See the table above: 138 hosts (half), but only 3 kW better, and queueing time to 13.7 minutes. 69 hosts (quarter), 
    halves power draw, but at the cost of 28 hours in the queue.
    Under-provisioning ICT infrastructure could lead to performance concerns, system faults, and, ultimately, system
    failures.
  choices:
    - With 138, half the power; with 69, a quarter; no job waits
    - With 138, no power saved; with 69, the jobs fail
    - With 138, about 16% less power and no job waits; with 69, about half
    - With 138, about 16% less power and some jobs wait; with 69, jobs wait more than a day
  answer: D
  explore: "Add 160 and 200 to `sizes`: what is the smallest number of hosts with which no job waits?"

"1.5":
  question: |
    How many of the 277 hosts does SURF need over the day, at the busiest and at the quietest moment?
  solution: |
    Between 99 (at 18:35) and 160 (at 08:05) of the 277 hosts.
  choices:
    - All 277, all day
    - Between about 100 and 160
    - Between about 10 and 50
    - Between about 200 and 277
  answer: B

"1.6":
  question: |
    Which costs of switching hosts off and on again does this estimate leave out?
  solution: |
    Boot time: hosts take time to boot, and consume energy. Also, a human-in-the-loop, aiming to ensure the correct and
    ethical operation of the process, oversees at least the major decisions (e.g., switching off hosts) and can intervene at any time.
  choices:
    - The energy of the jobs themselves
    - The carbon intensity of the grid
    - The boot time, and a human-in-the-loop overseeing the decisions
    - "None: switching hosts off and on is free"
  answer: C

"1.7":
  question: |
    With `SPARE = 0` and then `SPARE = 50` in the cell with `SPARE`, how much energy does SURF save, and what could go
    wrong without spare hosts?
  solution: |
    About 18% with 0 spare hosts and about 12% with 50; with 0, every new job waits for a host to boot.
  choices:
    - About 50% with 0 spare hosts and 40% with 50
    - About 12% with 0 spare hosts and 18% with 50
    - Nothing either way, as idle hosts draw little
    - About 18% with 0 spare hosts and 12% with 50
  answer: D
  explore: "Try `SPARE = 25` and `SPARE = 100`: how many spare hosts are worth keeping on, and why?"

# 2. Simulation Calibration

"2.1":
  question: |
    In notebook 1, OpenDT under-estimates the ground truth in almost every minute; should the Self-Calibrator increase
    or decrease r to close the gap?
  solution: |
    Increase r: at the same CPU utilization, a higher r gives a higher power draw (e.g., at 50% utilization, 165 W with
    r = 4 vs. 174 W with r = 9).
  choices:
    - Decrease r
    - Increase r
    - Keep r = 4
    - Set r below 1
  answer: B

"2.2":
  question: |
    Where does r change the power draw most: at low or at high CPU utilization?
  solution: |
    At high utilization: at 80%, 168 W with r = 2 vs. 243 W with r = 9. At 20%, the curves almost overlap (79 vs. 85 W),
    as u^r is tiny there, and at full load they all meet at 174 W. Calibration matters most when the hosts are busy.
  choices:
    - At low utilization, below 20%
    - At high utilization, over 80%
    - The same at every utilization
    - Only at full load
  answer: B
  explore: "Add r = 1 and r = 20 to the list in the cell with the curves: what does r do to the shape of the curve?"

"2.3":
  question: |
    Which r would OpenDT pick, from the table above?
  solution: |
    r = 7, with a MAPE of 4.5% (vs. 6.4% for r = 4).
  choices:
    - r = 3 (lowest end)
    - r = 4 (starting value)
    - r = 7 (intermediate value)
    - r = 9 (highest end)
  answer: C
  explore: "Add 2 and 10 to `R_VALUES` (each one more simulation of the week): does the best r move? Then set it back to
    3 to 9, as the cells below use it."

"2.4":
  question: |
    In 12:00-13:00, the best r is 7, but OpenDT simulates this window with r = 6. Why?
  choices:
    - "A bug: OpenDT should use r = 7"
    - OpenDT learns a window's best r only after the window ends, so it uses the best r of the window before
    - r = 6 is faster to simulate
    - The Self-Calibrator only runs every two hours
  answer: B
  solution: |
    OpenDT calibrates from the telemetry it has: the best r of 11:00-12:00 (r = 6) is the r of 12:00-13:00. The lag, however,
    costs little: 1.5% MAPE vs. 0.8% with the window's own best r, yet far below no calibration (4.8%, r = 4).

"2.5":
  question: |
    Does the best r stay the same from one day to the next, and what does this mean for a digital twin that runs for
    weeks?
  solution: |
    No; the best r changes between 5 and 9 from day to day.
    Static simulation models can drift and introduce errors as the time horizon increases: hardware behavior varies
    with temperature, aging, software stack, and many other factors, while workload characteristics evolve over time.
    Therefore, OpenDT recalibrates (need to recalibrate) continuously.
  choices:
    - "No, it changes between 5 and 9 from day to day"
    - "Yes, r = 7 every day"
    - "Yes, r = 4 every day"
    - "No, it changes between 1 and 2 from day to day"
  answer: A

"2.6":
  question: |
    With a budget of 5 simulations per window, which grid gives the better MAPE: depth (5 to 9) or breadth (1, 10, 20,
    30, 40)?
  solution: |
    Depth: MAPE 3.7% vs. 4.2%. The best r is between 5 and 9 in 81 of 168 hours, where depth puts all its simulations,
    while the coarse steps of breadth skip this range. Breadth and depth together (1 to 20) give 3.0%, but with 20
    simulations per window (4x the cost).
  choices:
    - "Depth: its values are where the best r is in most hours"
    - Breadth, as it covers more values of r
    - The same, as both run 5 simulations
    - Neither does better than no calibration (6.4%)
  answer: A

"2.7":
  question: |
    Recalibrating every 6 hours instead of every hour cuts the simulations from 168 to 28 per day; how much accuracy
    does the twin lose?
  solution: |
    A little: MAPE 4.0% vs. 3.6%, still far below no calibration (6.4%); recalibrating every 24 hours gives 4.8%, and
    every 48 hours, 5.7%. On a laptop with a few cores, the twin can trade a little accuracy for six times fewer
    simulations.
  choices:
    - Nothing
    - A little; it stays far below no calibration
    - All it gained from calibration
    - It becomes worse than no calibration
  answer: B

# 3. CO2-Aware Workload Migration

"3.1":
  question: |
    SURF runs in NL; which of the four countries has the grid with the lowest carbon intensity, on average, during the
    SURF week?
  solution: |
    RO has the lowest carbon intensity, with 343 gCO2/kWh on average, then NL (372), DE (508), and PL (868). For the
    same kWh, the grid of PL emits about 2.5x more CO2 than the grid of RO: in 2022, PL produced about 70% of its
    electricity from coal, while RO produced about 45% from hydropower and nuclear power.
  choices:
    - NL
    - PL
    - DE
    - RO
  answer: D

"3.2":
  question: |
    Estimate: we run SURF's workload in PL, instead of NL, on the same 277 hosts; what changes considerably: the energy, the CO2
    emissions, or both?
  solution: |
    The CO2 emissions only. In the simulation, which models the hosts but not the cooling (which also depends on the
    climate), the energy is the same in every country (3,424 kWh), since the workload and the hosts are the same; the
    CO2 emissions change with the carbon intensity of the grid, from 1,172 kg (RO) to 2,959 kg (PL). The same energy can
    lead to very different CO2 emissions, depending on how the grid produces it.
  choices:
    - The energy
    - The CO2 emissions
    - Both
    - Neither
  answer: B

"3.3":
  question: |
    Moving from NL to RO, the grid with the lowest carbon intensity on average, how much CO2 does SURF save in one week?
  solution: |
    About 6%: SURF emits 1,172 kg in RO vs. 1,253 kg in NL (81 kg less), as the carbon intensities of NL and RO are
    close on average. From PL to RO, the saving is much larger, about 60% (1,172 vs. 2,959 kg). Location influences CO2
    emissions, yet a migration between two similar grids saves little.
  choices:
    - Nothing
    - About 6%
    - About half
    - About 60%
  answer: B

"3.4":
  question: |
    On Monday 10 October, which country has the greenest grid, window by window?
  solution: |
    RO has the greenest grid until 09:00 and from 16:00, and NL from 09:00 to 16:00. The carbon intensity of a grid
    changes hour by hour, with how the grid produces its electricity (e.g., more solar power during the day); over the
    week, NL is greener than RO in 57 of 168 hours, although RO has the lowest average.
  choices:
    - RO, in every window
    - NL, in every window
    - RO and NL, shared
    - PL, in the afternoon
  answer: C
  explore: "Change the day in `hours` to 11 October: when is NL greener than RO?"

"3.5":
  question: |
    Following the greenest grid every hour, how much CO2 does SURF emit in one week, and at what cost?
  solution: |
    SURF emits 1,065 kg, 15% less than in NL and 9% less than in RO. It would be tempting to conclude that following the
    greenest grid is always beneficial; however, the company keeps free hosts in both datacenters (switched off when
    unused), and the workload migrates 11 times in one week, each migration costing energy and time (e.g., to move the
    jobs and their data over the network).
  choices:
    - About 15% less CO2 than in NL, with about a dozen migrations in the week
    - About 15% less CO2 than in NL, with no migration
    - About half the CO2 of NL, with hundreds of migrations
    - More CO2 than in NL, as migrations cost energy
  answer: A

"3.6":
  question: |
    Should SURF migrate its workload to RO, from what we have seen so far?
  solution: |
    Not yet. Moving to RO saves only 6% of the CO2 of NL, and NL is greener than RO in 57 of 168 hours; a migration also
    has costs of its own, which the human-in-the-loop weighs before such a major decision (see 4.2).
  choices:
    - Yes, as RO has the lowest carbon intensity on average
    - No, as a migration saves no CO2
    - Not yet, as the saving is small and a migration has costs of its own
    - Yes, but only at night
  answer: C

"3.7":
  question: |
    Of the CO2 that RO with 200 hosts saves, compared with NL with 277 hosts, how much comes from the migration to RO?
  solution: |
    About a third. RO with 200 hosts emits 1,061 kg, 192 kg (15%) less than NL with 277 hosts: 120 kg less from
    switching off 77 idle hosts (NL with 200 hosts emits 1,133 kg), and only 71 kg less from the migration to RO. With
    138 hosts in RO, the CO2 drops further (971 kg), but 2,631 jobs wait for a free host (78 minutes on average, over
    all jobs); under-provisioning ICT infrastructure could lead to performance concerns, as in notebook 1.
  choices:
    - All of it
    - About a third; the rest comes from switching off idle hosts
    - About half
    - None of it
  answer: B
  explore: "Add RO with 161 hosts (the most hosts in use at once over the week) to `options`: does any job wait?"

"3.8":
  question: |
    Estimate: if the company ran the SURF workload in SE, how much less CO2 would it emit in one week, compared with NL?
  solution: |
    About 95%: SURF would emit 62 kg in SE vs. 1,253 kg in NL, 20x less CO2 for the same energy, and far less than the
    1,065 kg of following the greenest of the company's four grids every hour. Location influences CO2 emissions more
    than any operational choice between similar grids; however, operating in SE means building (or renting) a new
    datacenter, with the trade-offs of section 4 (e.g., the CO2 emitted to build new hardware, the latency for the users).
  choices:
    - About 6%, as in RO
    - About 15%, as when following the greenest grid every hour
    - About half
    - About 95%
  answer: D
