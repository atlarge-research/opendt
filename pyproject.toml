[project]
name = "opendt"
version = "0.1.0"
description = "OpenDT - Open Digital Twin for Datacenters"
requires-python = ">=3.11"
dependencies = [
    # Core data processing (shared across all services)
    "pandas>=2.0.0",
    "pyarrow>=13.0.0",
    "pyyaml>=6.0.0",
    "matplotlib>=3.7.0",
    "jinja2>=3.1.0",  # pandas' .style, in the notebooks' tables
    # Kafka (used by most services)
    "kafka-python>=2.0.2",
    # Validation
    "pydantic>=2.0.0",
    # Web framework (for api service)
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    # CLI tool
    "typer>=0.9.0",
    "rich>=13.0.0",
    "ipykernel>=7.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "ipython>=8.0.0",
    "nbclient>=0.10",  # runs the tutorial notebooks in their tests
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = []

[tool.ruff]
line-length = 100
target-version = "py311"
# the published capsule stays as published; the notebooks are text first
extend-exclude = ["scratch/", "reproducibility-capsule/", "*.ipynb"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "C901",  # Function too complex
    "B008",  # Allow function calls in argument defaults (FastAPI pattern for Query, Body, etc.)
]

[tool.pytest.ini_options]
testpaths = ["libs/common/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
# kafka-python reads its protocol files with an importlib API that Python deprecates, for kafka-python to fix
filterwarnings = [
    "ignore:read_text is deprecated:DeprecationWarning",
    "ignore:open_text is deprecated:DeprecationWarning",
]

[tool.pyright]
include = ["libs", "services"]
extraPaths = ["libs/common"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
