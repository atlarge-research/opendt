name: Tests

# every push and pull request: the tests of the library, the services, the dashboards, and the tutorial, and the lint
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4  # OpenDC runs on Java 21
        with:
          distribution: temurin
          java-version: "21"
      - uses: astral-sh/setup-uv@v6
      - run: make setup
      - run: make test
      - run: make lint
